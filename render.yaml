# Blueprint de Render para el backend de TOBAIS.
# El frontend estático se sirve aparte desde Hostinger (dist/public -> public_html).
#
# Uso: en Render -> New -> Blueprint -> conectar este repositorio.
# Las variables con `sync: false` se piden al desplegar y no se guardan en git.

services:
  - type: web
    name: tobais-api
    runtime: node
    plan: free
    region: oregon
    # El main de tobais-web es un snapshot de abril de 2025 sin relación con
    # este código (historiales distintos, 248 archivos de diferencia). El
    # código que se despliega vive en esta rama.
    branch: produccion
    # --include=dev es imprescindible por dos motivos:
    #
    # 1) NODE_ENV=production (más abajo) también rige durante el build, y con
    #    esa variable npm omite las devDependencies. vite, esbuild, tailwind y
    #    los plugins viven ahí, así que sin esto `npm run build` falla.
    #
    # 2) server/vite.ts importa "vite" en el nivel superior y server/index.ts
    #    lo importa siempre, aun en producción donde solo usa serveStatic. Como
    #    esbuild empaqueta con --packages=external, ese import sigue vivo en
    #    dist/index.js y Node lo necesita al arrancar, no solo al compilar.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production

      # Dominios del frontend autorizados a llamar a esta API (separados por coma).
      # Sin esto, el navegador bloquea las peticiones con cookie de sesión.
      - key: ALLOWED_ORIGINS
        value: https://tobais.com,https://www.tobais.com

      # --- Base de datos (Neon) ---
      - key: DATABASE_URL
        sync: false

      # --- Sesiones ---
      - key: SESSION_SECRET
        generateValue: true

      # --- Pagos ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: production

      # --- IA ---
      - key: OPENAI_API_KEY
        sync: false

      # --- Email ---
      - key: SENDGRID_API_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_EMAIL
        sync: false
      - key: MAIL_FROM
        sync: false

      # --- Voz (Retell) ---
      - key: RETELL_API_KEY
        sync: false
      - key: RETELL_AGENT_ID
        sync: false

      # --- URLs públicas usadas en emails y enlaces de pago ---
      - key: APP_URL
        value: https://tobais.com
      - key: BASE_URL
        value: https://tobais.com
